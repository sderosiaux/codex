[package]
name = "codex-utils-image"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[package.metadata.cargo-shear]
# "image" does not forward png's zlib-rs feature. This direct dependency keeps
# encoded PNG bytes stable when WebSocket dependencies are absent from a build.
ignored = ["png"]

[dependencies]
base64 = { workspace = true }
image = { workspace = true, features = ["jpeg", "png", "gif", "webp"] }
png = { version = "0.18.0", features = ["zlib-rs"] }
codex-utils-cache = { workspace = true }
mime_guess = { workspace = true }
thiserror = { workspace = true }

[lib]
doctest = false
test = false
